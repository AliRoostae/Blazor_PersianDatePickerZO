name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lib/Blazor_PersianDatePickerZO.csproj

      - name: Build
        run: dotnet build Lib/Blazor_PersianDatePickerZO.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack Lib/Blazor_PersianDatePickerZO.csproj -c Release --no-build -o nupkg

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ZeroOneKian

      - name: Push to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
